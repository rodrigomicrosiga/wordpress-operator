replicaCount: 1

image:
  repository: rodrigomicrosiga/wordpress-operator
  tag: "v1.0.3"
  pullPolicy: IfNotPresent

manager:
  leaderElect: true
  leaderElectionID: "w98bc677.cloud104.io"
  metricsBindAddress: "0"
  healthProbeBindAddress: ":8081"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault