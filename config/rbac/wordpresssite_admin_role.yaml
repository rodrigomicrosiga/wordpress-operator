# This rule is not used by the project wordpress-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over wordpress.cloud104.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: wordpress-operator
    app.kubernetes.io/managed-by: kustomize
  name: wordpresssite-admin-role
rules:
- apiGroups:
  - wordpress.cloud104.io
  resources:
  - wordpresssites
  verbs:
  - '*'
- apiGroups:
  - wordpress.cloud104.io
  resources:
  - wordpresssites/status
  verbs:
  - get
