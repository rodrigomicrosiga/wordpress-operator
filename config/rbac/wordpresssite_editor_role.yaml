# This rule is not used by the project wordpress-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the wordpress.cloud104.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: wordpress-operator
    app.kubernetes.io/managed-by: kustomize
  name: wordpresssite-editor-role
rules:
- apiGroups:
  - wordpress.cloud104.io
  resources:
  - wordpresssites
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - wordpress.cloud104.io
  resources:
  - wordpresssites/status
  verbs:
  - get
